x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.10
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-meta:5432/airflow
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqJZmc=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__LOGGING_LEVEL=INFO
    - PYTHONPATH=/opt/airflow
    - AWS_ACCESS_KEY_ID=test
    - AWS_SECRET_ACCESS_KEY=test
    - AWS_DEFAULT_REGION=us-east-1
    - S3_ENDPOINT_URL=http://localstack:4566
    - ANALYTICS_DB_URL=postgresql://analytics_user:analytics_pass@postgres-analytics:5432/analytics_db
    - CATALOG_API_URL=http://catalog-api:8000
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
  depends_on:
    - airflow-meta
    - postgres-analytics
    - localstack

services:
  airflow-meta:
    image: postgres:15
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    volumes:
      - airflow-db-data:/var/lib/postgresql/data

  postgres-analytics:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=analytics_user
      - POSTGRES_PASSWORD=analytics_pass
      - POSTGRES_DB=analytics_db
    volumes:
      - ./sql/ddl_analytical_model.sql:/docker-entrypoint-initdb.d/init.sql
      - analytics-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.0.2
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
      - ACTIVATE_PRO=0
    volumes:
      - localstack-data:/var/lib/localstack

  catalog-api:
    build: ./mock_catalog_api
    ports:
      - "8000:8000"

  airflow-init:
    <<: *airflow-common
    command: version && airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin
    depends_on:
      airflow-meta:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

volumes:
  airflow-db-data:
  analytics-data:
  localstack-data: